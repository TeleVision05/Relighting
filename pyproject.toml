# Tool configuration only. Install dependencies from requirements.txt (runtime)
# and requirements-dev.txt (tests, lint, browser tests).

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
