name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      # The sample scenes are Git LFS objects; no check needs them, so do not download them.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: eslint
        run: npx eslint . --max-warnings=0
      - name: prettier
        run: npx prettier --check .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest -q

  # ---------------------------------------------------------------------------
  # BROWSER TESTS GO HERE (added by the browser-test task).
  # Add a job named `browser` that installs Playwright's Chromium
  # (`playwright install --with-deps chromium`), runs the viewer tests headless,
  # and uploads screenshots with actions/upload-artifact. Keep `lfs: false` unless
  # a test truly needs a committed scene.
  # ---------------------------------------------------------------------------
