<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relighting Demo — Buttons</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #030712;
        --bg2: #0f172a;
        --panel: rgba(15, 23, 42, 0.92);
        --border: rgba(148, 163, 184, 0.24);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at top left, #111827 0%, var(--bg) 45%, #020617 100%);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body { display: flex; }
      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 16px;
        width: 100vw;
        height: 100vh;
        padding: 16px;
      }
      .viewport {
        min-width: 0;
        min-height: 0;
        border: 1px solid var(--border);
        border-radius: 24px;
        overflow: hidden;
        background: linear-gradient(145deg, rgba(15,23,42,0.96), rgba(2,6,23,0.95));
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
        position: relative;
      }
      .canvas-wrap {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .hero {
        position: absolute;
        top: 16px;
        left: 16px;
        max-width: 420px;
        padding: 12px 14px;
        border: 1px solid rgba(56, 189, 248, 0.22);
        border-radius: 14px;
        background: rgba(2, 8, 23, 0.72);
        backdrop-filter: blur(8px);
        z-index: 2;
      }
      .hero h1 {
        margin: 0 0 6px;
        font-size: 16px;
        font-weight: 700;
      }
      .hero p {
        margin: 0;
        font-size: 12px;
        line-height: 1.45;
        color: #cbd5e1;
      }
      .legend {
        position: absolute;
        left: 16px;
        bottom: 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        z-index: 2;
      }
      .chip {
        padding: 7px 10px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.82);
        border: 1px solid rgba(148, 163, 184, 0.24);
        font-size: 11px;
        color: #e2e8f0;
      }
      .panel {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
        min-height: 0;
      }
      .panel h2 {
        margin: 0 0 2px;
        font-size: 16px;
      }
      .panel p {
        margin: 0;
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
      }
      .stack {
        display: grid;
        gap: 8px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
      }
      .row label { flex: 1; color: #cbd5e1; }
      input[type="range"] { flex: 1; accent-color: var(--accent); }
      input[type="color"] { width: 42px; height: 24px; border: none; padding: 0; background: transparent; }
      button {
        margin-top: 2px;
        padding: 9px 10px;
        border: 1px solid rgba(56, 189, 248, 0.34);
        border-radius: 10px;
        background: linear-gradient(135deg, #0f766e, #1d4ed8);
        color: white;
        cursor: pointer;
        font-weight: 600;
      }
      .hero {
        margin-bottom: 14px;
      }
      .hero h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      .hero p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .split {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      figure {
        margin: 0;
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        background: rgba(2, 6, 23, 0.75);
      }
      img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: cover;
        background: #020617;
      }
      figcaption {
        padding: 8px 10px;
        font-size: 12px;
        color: #cbd5e1;
        border-top: 1px solid var(--border);
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(2, 6, 23, 0.72);
      }
      .controls h2 {
        margin: 0;
        font-size: 15px;
      }
      .controls .row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .controls .row label {
        flex: 0 0 110px;
        color: #cbd5e1;
      }
      .controls input[type="range"] {
        flex: 1;
      }
      .controls input[type="color"] {
        width: 42px;
        height: 24px;
      }
      .controls button {
        margin-top: 2px;
      }
      .status {
        font-size: 11px;
        color: #7dd3fc;
      }
      .rendering-overlay {
        position: absolute;
        inset: 0;
        background: rgba(2, 6, 23, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .rendering-overlay.active {
        display: flex;
      }
      .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(56, 189, 248, 0.2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .small {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.45;
      }
      @media (max-width: 960px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 300px;
        }
        .panel {
          overflow: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <section class="panel">
        <div class="hero">
          <h1>True Gaussian-splat rendering</h1>
          <p>This page now displays images rendered directly from the original PLY Gaussian parameters using a Python rasterizer, rather than a browser-side approximation.</p>
        </div>

        <div class="split">
          <figure>
            <img id="neutralImg" src="rendered_neutral.png" alt="Neutral Gaussian-splat render" />
            <figcaption>Neutral / baked render</figcaption>
          </figure>
          <figure>
            <img id="relitImg" src="rendered_relit.png" alt="Relit Gaussian-splat render" />
            <figcaption>Relit with custom illumination</figcaption>
          </figure>
        </div>
      </section>

      <aside class="panel">
        <div class="controls">
          <h2>Lighting controls</h2>
          <div class="row"><label>Ambient</label><input id="ambient" type="range" min="0" max="0.8" step="0.01" value="0.16"></div>
          <div class="row"><label>Directional intensity</label><input id="dirInt" type="range" min="0" max="2.2" step="0.01" value="1.0"></div>
          <div class="row"><label>Dir X</label><input id="dirX" type="range" min="-1" max="1" step="0.01" value="0.3"></div>
          <div class="row"><label>Dir Y</label><input id="dirY" type="range" min="-1" max="1" step="0.01" value="0.8"></div>
          <div class="row"><label>Dir Z</label><input id="dirZ" type="range" min="-1" max="1" step="0.01" value="0.5"></div>
          <div class="row"><label>Light color</label><input id="dirColor" type="color" value="#ffffff"></div>
          <div class="row"><label>Point intensity</label><input id="pointInt" type="range" min="0" max="2.8" step="0.01" value="0.4"></div>
          <div class="row"><label>Point X</label><input id="pointX" type="range" min="-2" max="2" step="0.01" value="0.6"></div>
          <div class="row"><label>Point Y</label><input id="pointY" type="range" min="-2" max="2" step="0.01" value="0.9"></div>
          <div class="row"><label>Point Z</label><input id="pointZ" type="range" min="-2" max="2" step="0.01" value="0.2"></div>
          <div class="row"><label>Point color</label><input id="pointColor" type="color" value="#7dd3fc"></div>
          <button id="refreshBtn">Refresh renders</button>
          <button id="resetBtn">Reset</button>
          <div class="status" id="status">Ready</div>
        </div>
      </aside>
    </div>

    <script>
      const neutralImg = document.getElementById('neutralImg');
      const relitImg = document.getElementById('relitImg');
      const statusEl = document.getElementById('status');
      let renderTimeout: ReturnType<typeof setTimeout> | null = null;

      // Create rendering overlay once
      const splitPanels = document.querySelectorAll('.split figure');
      splitPanels.forEach((figure) => {
        const overlay = document.createElement('div');
        overlay.className = 'rendering-overlay';
        overlay.innerHTML = '<div class="spinner"></div>';
        figure.appendChild(overlay);
      });

      function showLoading() {
        document.querySelectorAll('.rendering-overlay').forEach(o => o.classList.add('active'));
      }

      function hideLoading() {
        document.querySelectorAll('.rendering-overlay').forEach(o => o.classList.remove('active'));
      }

      const ui = {
        ambient: document.getElementById('ambient'),
        dirInt: document.getElementById('dirInt'),
        dirX: document.getElementById('dirX'),
        dirY: document.getElementById('dirY'),
        dirZ: document.getElementById('dirZ'),
        dirColor: document.getElementById('dirColor'),
        pointInt: document.getElementById('pointInt'),
        pointX: document.getElementById('pointX'),
        pointY: document.getElementById('pointY'),
        pointZ: document.getElementById('pointZ'),
        pointColor: document.getElementById('pointColor')
      };

      function readUI() {
        return {
          ambient: parseFloat(ui.ambient.value),
          dirInt: parseFloat(ui.dirInt.value),
          dirX: parseFloat(ui.dirX.value),
          dirY: parseFloat(ui.dirY.value),
          dirZ: parseFloat(ui.dirZ.value),
          dirColor: ui.dirColor.value,
          pointInt: parseFloat(ui.pointInt.value),
          pointX: parseFloat(ui.pointX.value),
          pointY: parseFloat(ui.pointY.value),
          pointZ: parseFloat(ui.pointZ.value),
          pointColor: ui.pointColor.value
        };
      }

      function colorToRgbHex(hex) {
        const value = hex.replace('#', '');
        const full = value.length === 3 ? value.split('').map(c => c + c).join('') : value;
        return [parseInt(full.slice(0, 2), 16) / 255, parseInt(full.slice(2, 4), 16) / 255, parseInt(full.slice(4, 6), 16) / 255].join(',');
      }

      async function refreshRenders() {
        const values = readUI();
        const params = new URLSearchParams({
          ambient: values.ambient,
          dirInt: values.dirInt,
          dirX: values.dirX,
          dirY: values.dirY,
          dirZ: values.dirZ,
          dirColor: colorToRgbHex(values.dirColor),
          pointInt: values.pointInt,
          pointX: values.pointX,
          pointY: values.pointY,
          pointZ: values.pointZ,
          pointColor: colorToRgbHex(values.pointColor)
        });
        statusEl.textContent = 'Rendering…';
        try {
          await fetch(`/render?${params.toString()}&mode=neutral`, { cache: 'no-store' });
          await fetch(`/render?${params.toString()}&mode=relit`, { cache: 'no-store' });
          neutralImg.src = `rendered_neutral.png?ts=${Date.now()}`;
          relitImg.src = `rendered_relit.png?ts=${Date.now()}`;
          statusEl.textContent = 'Rendered';
        } catch (err) {
          statusEl.textContent = 'Render failed';
          console.error(err);
        }
      }

      document.getElementById('refreshBtn').addEventListener('click', refreshRenders);
      document.getElementById('resetBtn').addEventListener('click', () => {
        ui.ambient.value = '0.16';
        ui.dirInt.value = '1.0';
        ui.dirX.value = '0.3';
        ui.dirY.value = '0.8';
        ui.dirZ.value = '0.5';
        ui.dirColor.value = '#ffffff';
        ui.pointInt.value = '0.4';
        ui.pointX.value = '0.6';
        ui.pointY.value = '0.9';
        ui.pointZ.value = '0.2';
        ui.pointColor.value = '#7dd3fc';
        refreshRenders();
      });
      Object.values(ui).forEach(input => input.addEventListener('input', refreshRenders));
      refreshRenders();
    </script>
  </body>
</html>
